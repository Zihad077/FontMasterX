        .bg-mesh {

                        radial-gradient(circle at 85% 30%, rgba(0, 212, 255, 0.1), transparent 30%);
            animation: bgPulse 10s ease-in-out infinite alternate;
        }
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: linear-gradient(rgba(148, 193, 255, 0.04) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 193, 255, 0.04) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);

        @keyframes bgPulse { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.1); opacity: 1; } }

        header { padding: 45px 20px 20px; text-align: center; position: relative; }

        #toast {

<script>
    // PWA INSTALL
    let deferredPrompt;
    const installBtn = document.getElementById('installBtn');
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installBtn.style.display = 'flex';
    });
    installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') installBtn.style.display = 'none';
            deferredPrompt = null;
        }
