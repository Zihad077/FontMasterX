        vibrate();
        try {
            await navigator.clipboard.writeText(txt);
            showToast();
            setTimeout(() => { triggerAd(); }, 400);
        } catch(e) {
            const t = document.createElement("textarea");
            t.value = txt;
            document.body.appendChild(t);
            t.select();
            document.execCommand("copy");
            t.remove();
            showToast();
            setTimeout(() => { triggerAd(); }, 400);
        }
    }

    async function doShare(originalTxt) {
        vibrate();
        const finalTxt = originalTxt + "\n\nCreated By https://fontmasterx.vercel.app";
        if (navigator.share) {
            try { await navigator.share({ title: 'FontMasterX', text: finalTxt }); } catch (e) {}

            try { await navigator.clipboard.writeText(finalTxt); showToast(); }
            catch(e) {
                const t = document.createElement("textarea");
                t.value = finalTxt;
                document.body.appendChild(t);
                t.select(); document.execCommand("copy"); t.remove();
                showToast();

        }

    const GH_USER = 'Zihad077';
    const GH_REPO = 'FontMasterX';
    const GH_BRANCH = 'main';
    const BLOG_FOLDER = 'blog';
    const CACHE_KEY = 'fmx_blog_cache_v1';
    const CACHE_TTL = 60 * 60 * 1000; // 1 hour

    async function fetchBlogPosts() {
        // Try cache
        try {
            const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
            if (cached && cached.timestamp && (Date.now() - cached.timestamp) < CACHE_TTL && Array.isArray(cached.posts) && cached.posts.length) {
                return cached.posts;
            }
        } catch(e) {}

        const posts = [];
        try {
            const apiUrl = `https://api.github.com/repos/${GH_USER}/${GH_REPO}/contents/${BLOG_FOLDER}?ref=${GH_BRANCH}`;
            const res = await fetch(apiUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
            if (!res.ok) throw new Error('GitHub API failed: ' + res.status);
            const files = await res.json();
            if (!Array.isArray(files)) throw new Error('Invalid response');
            const htmlFiles = files.filter(f => f.type === 'file' && /\.html?$/i.test(f.name));

            const results = await Promise.all(htmlFiles.map(async (f) => {
                try {
                    const fileRes = await fetch(f.download_url);
                    if (!fileRes.ok) return null;
                    const html = await fileRes.text();
                    const doc = new DOMParser().parseFromString(html, 'text/html');
                    let title = (doc.querySelector('title')?.textContent || f.name).trim();
                    title = title.replace(/\s*[-–|·]\s*FontMasterX\s*$/i, '').trim();
                    const desc = (doc.querySelector('meta[name="description"]')?.getAttribute('content') || '').trim();
                    const tag = (doc.querySelector('meta[name="article:tag"]')?.getAttribute('content') || 'Blog').trim();
                    const readTime = (doc.querySelector('meta[name="article:read-time"]')?.getAttribute('content') || '').trim();
                    const date = (doc.querySelector('meta[property="article:published_time"]')?.getAttribute('content') || doc.querySelector('meta[name="article:date"]')?.getAttribute('content') || '').trim();
                    return {
                        id: f.name.replace(/\.html?$/i, ''),
                        title,
                        excerpt: desc,
                        tag,
                        readTime,
                        date,
                        url: `/${BLOG_FOLDER}/${f.name}`
                    };
                } catch(e) { return null; }
            }));

            posts.push(...results.filter(Boolean));

            // Save cache
            try { localStorage.setItem(CACHE_KEY, JSON.stringify({ timestamp: Date.now(), posts })); } catch(e) {}
        } catch(err) {
            console.warn('Blog fetch failed:', err);
        }
        return posts;
    }

    async function renderBlogList() {
        const container = el('outBlog');
        if (!container) return;

        // Loading state
        container.innerHTML = `
            <div style="text-align:center; margin-bottom:24px;">
                <h2 style="font-size:24px; font-weight:900; color:#ffffff; text-shadow:0 0 15px rgba(0,212,255,0.4); margin-bottom:8px; letter-spacing:0.5px;">📝 FontMasterX Blog</h2>
                <p style="color:var(--text-sub); font-size:14px; line-height:1.6;">Tips, guides, and tutorials for stylish fonts, gamer tags, and social media.</p>
            </div>
            <p style="text-align:center; color:var(--text-sub); padding:40px 20px; font-weight:500;">⏳ Loading posts...</p>
        `;

        const posts = await fetchBlogPosts();

        if (!posts.length) {
            container.innerHTML = `
                <div style="text-align:center; margin-bottom:24px;">
                    <h2 style="font-size:24px; font-weight:900; color:#ffffff; text-shadow:0 0 15px rgba(0,212,255,0.4); margin-bottom:8px; letter-spacing:0.5px;">📝 FontMasterX Blog</h2>
                    <p style="color:var(--text-sub); font-size:14px; line-height:1.6;">Tips, guides, and tutorials for stylish fonts, gamer tags, and social media.</p>
                </div>
                <p style="text-align:center; color:var(--text-sub); padding:40px 20px; font-weight:500;">No blog posts found. Upload HTML files to <code style="color:var(--accent-cyan);">/blog/</code> folder.</p>
            `;
            return;
        }

        container.innerHTML = `
            <div style="text-align:center; margin-bottom:24px;">
                <h2 style="font-size:24px; font-weight:900; color:#ffffff; text-shadow:0 0 15px rgba(0,212,255,0.4); margin-bottom:8px; letter-spacing:0.5px;">📝 FontMasterX Blog</h2>
                <p style="color:var(--text-sub); font-size:14px; line-height:1.6;">Tips, guides, and tutorials for stylish fonts, gamer tags, and social media.</p>
            </div>
        `;

        const frag = document.createDocumentFragment();
        posts.forEach(post => {
            const card = document.createElement('a');
            card.className = 'card blog-post-card';
            card.href = post.url;
            card.innerHTML = `
                <div class="post-title"></div>
                <div class="post-excerpt"></div>
                <div class="post-meta">
                    <span></span>
                    <span class="read-more">Read More →</span>
                </div>
            `;
            card.querySelector('.post-title').textContent = post.title;
            card.querySelector('.post-excerpt').textContent = post.excerpt || 'Click to read more...';
            let metaText = post.tag;
            if (post.readTime) metaText += ' · ' + post.readTime;
            else if (post.date) metaText += ' · ' + post.date;
            card.querySelector('.post-meta span:first-child').textContent = metaText;
            frag.appendChild(card);
        });
        container.appendChild(frag);
    }

    // ============ EVENT DELEGATION ============
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const card = btn.closest('.card, .grid-card');
        if (!card) return;
        const txt = card.dataset.text || '';
        const action = btn.dataset.action;
        if (action === 'copy') doCopy(txt);
        else if (action === 'share') doShare(txt);
        else if (action === 'fav') doFav(btn, txt);
    });

    // ============ INIT ============
    el('inp').addEventListener('input', renderStyler);
    const decorFrag = document.createDocumentFragment();
    syms.forEach(s => decorFrag.appendChild(createGridCard(s)));
    el('outDecor').appendChild(decorFrag);
    renderStyler();
</script>
